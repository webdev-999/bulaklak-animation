<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Message</title>
    <style>
        body {
            margin: 0;
            background: #0b0914;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        #textDisplay {
            font-size: 32px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
            min-height: 50px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        #textDisplay.show {
            opacity: 1;
        }
        #emojiDisplay {
            font-size: 80px;
            margin-top: 25px;
            opacity: 0;
            transform: scale(0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #emojiDisplay.show {
            opacity: 1;
            transform: scale(1);
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ff77aa;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        I-click mo 'to... para sa katotohanan 💔
    </div>

    <div class="container">
        <div id="textDisplay"></div>
        <div id="emojiDisplay">🖕</div>
    </div>

    <!-- Eksaktong GitHub Raw link ng MP3 mo -->
    <audio id="sadMusic" loop>
    <source src="kanta.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>


    <script>
        const words = ["HINDI", "KANA", "NYA", "MAHAL"];
        const textDisplay = document.getElementById("textDisplay");
        const emojiDisplay = document.getElementById("emojiDisplay");
        const overlay = document.getElementById("overlay");
        const music = document.getElementById("sadMusic");
        
        let wordIndex = 0;

        function showWords() {
            if (wordIndex < words.length) {
                textDisplay.classList.add("show");
                textDisplay.innerHTML += (wordIndex === 0 ? "" : " ") + words[wordIndex];
                wordIndex++;
                setTimeout(showWords, 650);
            } else {
                setTimeout(() => {
                    emojiDisplay.classList.add("show");
                }, 800);
            }
        }

        function startExperience() {
            overlay.style.display = 'none';
            music.volume = 0.8;
            music.play().catch(e => console.log("Music error:", e));
            setTimeout(showWords, 300);
            document.body.removeEventListener('click', startExperience);
            overlay.removeEventListener('click', startExperience);
        }

        document.body.addEventListener('click', startExperience);
        overlay.addEventListener('click', startExperience);
    </script>
</body>
</html>
