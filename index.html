<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Animation</title>
    <style>
        body {
            margin: 0;
            background: #0b0914;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        #textDisplay {
            font-size: 32px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
            min-height: 50px;
            letter-spacing: 2px;
        }
        #emojiDisplay {
            font-size: 80px;
            margin-top: 25px;
            opacity: 0;
            transform: scale(0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #emojiDisplay.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="textDisplay"></div>
        <div id="emojiDisplay">🖕</div>
    </div>

    <script>
        const words = ["HINDI", "KANA", "NYA", "MAHAL"];
        const textDisplay = document.getElementById("textDisplay");
        const emojiDisplay = document.getElementById("emojiDisplay");
        
        let wordIndex = 0;

        function showWords() {
            if (wordIndex < words.length) {
                // Idadagdag ang bawat salita isa-isa
                textDisplay.innerHTML += (wordIndex === 0 ? "" : " ") + words[wordIndex];
                wordIndex++;
                setTimeout(showWords, 600); // Bilis ng paglabas per word (milliseconds)
            } else {
                // Pagkatapos lumabas ng lahat ng salita, lalabas ang emoji paglipas ng konting segundo
                setTimeout(() => {
                    emojiDisplay.classList.add("show");
                }, 400);
            }
        }

        // Simulan ang animation pag-load ng page
        window.onload = () => {
            setTimeout(showWords, 500);
        };
    </script>
</body>
</html>
